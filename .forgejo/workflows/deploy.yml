name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    # Host runner on beast (see the-flake: systems/services/forgejo-runner.nix);
    # zola and nodejs come from the runner's hostPackages.
    runs-on: native
    steps:
      - uses: actions/checkout@v4
      - run: zola build
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy public --project-name=antono-info --branch=master
