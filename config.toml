base_url = "https://antono.info"
title = "Antono Vasiljev"
description = "Trivialaĵoj pri programado"
# "und" (undetermined) is a hidden default: it only renders the root home page,
# so every language (eo included) lives under its own prefix: /eo/, /en/, /ru/.
default_language = "und"
compile_sass = false
build_search_index = false
generate_feeds = false

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"

# root home page ("und") is the Esperanto one
[translations]
sections_label = "Sekcioj"
elsewhere = "Aliloke"
site_nav_label = "Retejo"
pager_label = "Najbaraj afiŝoj"
older = "Pli frue"
newer = "Pli poste"
name = "Antono Vasiljev"
description = "Antono Vasiljev — persona paĝo kun ligiloj al Mastodon, GitHub, SoundCloud kaj blogo."
blog = "Blogo"
blog_description = "Trivialaĵoj pri programado"
tags = "Etikedoj"
tagged = "Afiŝoj kun etikedo"
updated = "ĝisdatigita"
feed = "Atom-fluo"
mirror_note = "Ĉi tiu afiŝo ankoraŭ ne estas tradukita. Jen la originalo:"
language_name = "Esperanto"
language_name_en = "angle"
language_name_ru = "ruse"
language_name_eo = "esperante"
languages_label = "Lingvo"

