{% extends "base.html" %}

{% block title %}{{ trans(key='tags', lang=lang) }} — {{ trans(key='name', lang=lang) }}{% endblock %}

{% block body %}
  <main>
    <h1>{{ trans(key='tags', lang=lang) }}</h1>
    <ul class="tags">
      {%- for term in terms %}
      <li><a href="{{ term.permalink | safe }}">#{{ term.name }} <span>{{ term.pages | length }}</span></a></li>
      {%- endfor %}
    </ul>
  </main>
{% endblock %}
